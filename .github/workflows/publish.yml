name: Publish

# A Go release needs no registry upload and no token: the module proxy and
# pkg.go.dev read the tag from this repository. This job proves the tag is
# good, warms the proxy so the first `go get` is fast, and attaches the module
# zip to the release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Warm the module proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the module zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name != "Warm the module proxy")] | if length == 0 then "pending" elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failed" elif all(.status == "completed") then "passed" else "pending" end')"
            case "$state" in
              passed) echo "checks passed for $sha"; exit 0 ;;
              failed) echo "::error::checks failed for $sha; not releasing"; exit 1 ;;
              *) echo "waiting for checks on $sha ($attempt/40)"; sleep 30 ;;
            esac
          done
          echo "::error::checks did not finish in time for $sha"
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Tag matches the Version constant
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' client.go)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Version $want in client.go"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Warm the module proxy
        run: |
          set -euo pipefail
          module="$(go list -m)"
          escaped="$(printf '%s' "$module" | sed 's/\([A-Z]\)/!\L\1/g')"
          for attempt in $(seq 1 10); do
            if curl -fsS "https://proxy.golang.org/${escaped}/@v/${GITHUB_REF_NAME}.info" >/dev/null; then
              echo "proxy has ${module}@${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "waiting for the proxy to pick up the tag ($attempt/10)"
            sleep 30
          done
          echo "::warning::the proxy has not picked up the tag yet; it will on the first go get"

      - name: Attach the module zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          module="$(go list -m)"
          version="${GITHUB_REF_NAME}"
          GOFLAGS=-mod=mod go mod download -x "${module}@${version}" 2>/dev/null || true
          zip="$(find "$(go env GOMODCACHE)/cache/download" -name "${version}.zip" | head -1)"
          if [ -n "$zip" ]; then
            cp "$zip" "checkslip-go-${version}.zip"
            gh release upload "$version" "checkslip-go-${version}.zip" --clobber
          else
            echo "::warning::no module zip found to attach"
          fi
