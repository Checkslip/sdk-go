name: Publish

# A Go release needs no registry upload and no token: the module proxy and
# pkg.go.dev read the tag from this repository. This job proves the tag is
# good, warms the proxy so the first `go get` is fast, and attaches the module
# zip to the release.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Warm the module proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the module zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # Ask the other workflows by file name. Counting every check run on
          # the commit would include this job, which waits for itself forever.
          for attempt in $(seq 1 40); do
            pending=0
            failed=0
            for wf in ci.yml commits.yml; do
              state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${sha}&per_page=1" \
                --jq '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end')"
              case "$state" in
                success) ;;
                missing|running) pending=1 ;;
                *) echo "::error::${wf} on ${sha} concluded ${state}"; failed=1 ;;
              esac
            done
            if [ "$failed" = 1 ]; then exit 1; fi
            if [ "$pending" = 0 ]; then echo "ci.yml and commits.yml passed for ${sha}"; exit 0; fi
            echo "waiting for the checks on ${sha} (${attempt}/40)"
            sleep 20
          done
          echo "::error::the checks did not finish in time for ${sha}"
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Tag matches the Version constant
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          want="v$(sed -n 's/^const Version = "\([^"]*\)".*/\1/p' client.go)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match Version $want in client.go"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: Warm the module proxy
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          module="$(go list -m)"
          escaped="$(printf '%s' "$module" | sed 's/\([A-Z]\)/!\L\1/g')"
          for attempt in $(seq 1 10); do
            if curl -fsS "https://proxy.golang.org/${escaped}/@v/${TAG}.info" >/dev/null; then
              echo "proxy has ${module}@${TAG}"
              exit 0
            fi
            echo "waiting for the proxy to pick up the tag ($attempt/10)"
            sleep 30
          done
          echo "::warning::the proxy has not picked up the tag yet; it will on the first go get"

      - name: Attach the module zip to the release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          module="$(go list -m)"
          version="${TAG}"
          GOFLAGS=-mod=mod go mod download -x "${module}@${version}" 2>/dev/null || true
          zip="$(find "$(go env GOMODCACHE)/cache/download" -name "${version}.zip" | head -1)"
          if [ -n "$zip" ]; then
            cp "$zip" "checkslip-go-${version}.zip"
            gh release upload "$version" "checkslip-go-${version}.zip" --clobber
          else
            echo "::warning::no module zip found to attach"
          fi
