name: Release please

# Keeps a release pull request up to date from the Conventional Commits on
# main: it works out the next version and writes the changelog. Merging that
# pull request tags vX.Y.Z and publishes a GitHub Release.
#
# A Go module needs no registry and no credential: the module proxy and
# pkg.go.dev read the tag from this repository.

on:
  push:
    branches: [main]
  # Publishing an existing tag has to start here, not in publish.yml: the OIDC
  # workflow_ref claim names the workflow that started the run, and the
  # registries trust this file.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Publish this existing tag instead of cutting a release, for example v0.1.1.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: inputs.publish_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A pull request opened with GITHUB_TOKEN raises no events either, so the
  # release pull request would never be checked. Run the suite against its
  # branch here, so nobody merges a release that does not build.
  verify-release-pr:
    needs: release-please
    if: inputs.publish_tag == '' && needs.release-please.outputs.pr_branch != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.pr_branch }}
    permissions:
      contents: read

  # GitHub also records a CI and a Commits run for the release branch that
  # never start a single job: no steps, no logs, conclusion failure, and no
  # check runs attached. Nothing is blocked by them, but they put a red cross
  # on the release pull request, which teaches whoever merges it to ignore red.
  # verify-release-pr above is the run that really builds that branch, so this
  # reports that result on the commit as a check and clears the empty runs.
  report-release-pr:
    needs: [release-please, verify-release-pr]
    if: always() && inputs.publish_tag == '' && needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: read
    steps:
      - name: Report the verification, then clear the empty runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          RESULT: ${{ needs.verify-release-pr.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)"
          case "$RESULT" in
            success) conclusion=success ;;
            skipped|cancelled) conclusion=neutral ;;
            *) conclusion=failure ;;
          esac
          gh api -X POST "repos/$REPO/check-runs" \
            -f name='Release PR verified' \
            -f head_sha="$sha" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="$RUN_URL" \
            -f 'output[title]=The suite ran against this release branch' \
            -f "output[summary]=A pull request opened with GITHUB_TOKEN raises no events, so this branch gets no checks of its own. The suite ran against it in $RUN_URL and finished: $RESULT." >/dev/null
          echo "posted 'Release PR verified' ($conclusion) on $sha"

          # Clearing the empty runs is cosmetic, so from here on a failure is
          # reported and nothing else: a release must not fail over it.
          set +e

          # The empty records arrive with the pull request, which is a moment
          # before this job starts.
          sleep 20

          # Only a run with no jobs at all is touched, so a run that really
          # tested something is never approved away or deleted here.
          #
          # The empty runs sit in a check suite whose conclusion is
          # action_required: GitHub is waiting for someone to approve them, not
          # reporting a failure. Approving is better than deleting, because
          # then the real suite runs on the pull request itself. If the token
          # cannot approve its own runs, the empty record is deleted instead so
          # nothing red is left on the pull request.
          gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "startup_failure" or .conclusion == "action_required") | .id' |
          while read -r id; do
            [ -n "$id" ] || continue
            jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq .total_count)"
            if [ "$jobs" != "0" ]; then
              echo "run $id has $jobs job(s); left alone"
              continue
            fi
            if gh api -X POST "repos/$REPO/actions/runs/$id/approve" >/dev/null 2>&1; then
              echo "run $id started no jobs; approved it, so its checks run here"
              continue
            fi
            echo "run $id started no jobs and could not be approved; deleting it"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || echo "could not delete run $id"
          done

  # A release created with GITHUB_TOKEN does not raise the `release` event, so
  # the publish job is called from here instead of waiting for it.
  publish:
    needs: release-please
    if: |
      always() && (inputs.publish_tag != ''
      || needs.release-please.outputs.released == 'true')
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release-please.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
